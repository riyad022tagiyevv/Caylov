
<!DOCTYPE html>
<html>
<head>
    <title>Ofisiant Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🍽 Ofisiant Paneli</h1>

<h2>Masa:</h2>
<input id="table" type="number" placeholder="Masa nömrəsi">

<h2>Sifariş:</h2>
<select id="meal">
    <!-- Dönərlər -->
    <option>Tombik Toyuq</option>
    <option>Tombik Mal</option>
    <option>Kiçik Təndir Toyuq</option>
    <option>Kiçik Təndir Mal</option>
    <option>Böyük Təndir Toyuq</option>
    <option>Böyük Təndir Mal</option>
    <option>Lavaşda Dönər Toyuq</option>
    <option>Lavaşda Dönər Mal</option>

    <!-- Basdırma -->
    <option>Basdırma Toyuq</option>
    <option>Basdırma Mal</option>

    <!-- Adana -->
    <option>Adana Toyuq</option>
    <option>Adana Mal</option>

    <!-- Lavaşda -->
    <option>Lavaşda Toyuq</option>
    <option>Lavaşda Mal</option>

    <!-- Şaurma -->
    <option>Şaurma Çörəkdə Toyuq</option>
    <option>Şaurma Çörəkdə Mal</option>
    <option>Şaurma Lavaşda Toyuq</option>
    <option>Şaurma Lavaşda Mal</option>

    <!-- Köftə -->
    <option>Köftə Çörəkdə Toyuq</option>
    <option>Köftə Çörəkdə Mal</option>
    <option>Köftə Lavaşda Toyuq</option>
    <option>Köftə Lavaşda Mal</option>

    <!-- Burger və Hamburger -->
    <option>Burger Toyuq</option>
    <option>Burger Mal</option>
    <option>Hamburger</option>

    <!-- Sandviç -->
    <option>Sandviç Böyük</option>
    <option>Sandviç Kiçik</option>

    <!-- Sosis -->
    <option>Sosis Böyük</option>
    <option>Sosis Kiçik</option>

    <!-- Kartof -->
    <option>Kartof Fri</option>

    <!-- Setlər -->
    <option>Set 1</option>
    <option>Set 2</option>
    <option>Set 3</option>
    <option>Set 4</option>
    <option>Set 5</option>
    <option>Set 6</option>

    <!-- Kampaniya -->
    <option>Dönər + Ayran 2m</option>
</select>

<h2>Qeyd:</h2>
<input id="note" type="text" placeholder="Məs: Acılı, sous az olsun...">

<button onclick="sendOrder()">📤 Sifarişi Göndər</button>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase.js"></script>

<script>
const audio = new Audio("order.mp3");

function sendOrder() {
    const table = document.getElementById("table").value;
    const meal  = document.getElementById("meal").value;
    const note  = document.getElementById("note").value;

    if (!table) { 
        alert("Masa nömrəsi daxil olunmalıdır!"); 
        return; 
    }

    const order = { meal, table, note, time: new Date().toLocaleTimeString() };

    // Firebase Realtime Database
    database.ref("orders").push(order)
        .then(() => {
            audio.play();
            alert("✔ Sifariş mətbəxə göndərildi!");
            document.getElementById("table").value = "";
            document.getElementById("note").value = "";
        })
        .catch((error) => {
            alert("❌ Sifarişi göndərmək mümkün olmadı: " + error);
        });
}
</script>

</body>
</html>
