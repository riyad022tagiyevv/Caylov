<!DOCTYPE html>
<html>
<head>
    <title>Ofisiant Paneli</title>
    <link rel="stylesheet" href="style.css">
    <style>
        label { display: block; margin: 5px 0; font-size: 16px; }
    </style>
</head>
<body>

<h1>🍽 Ofisiant Paneli</h1>

<h2>Masa:</h2>
<input id="table" type="number" placeholder="Masa nömrəsi">

<h2>Sifariş:</h2>
<div id="meal-options">
    <!-- Dönərlər -->
    <label><input type="checkbox" value="Tombik Toyuq"> Tombik Toyuq</label>
    <label><input type="checkbox" value="Tombik Mal"> Tombik Mal</label>
    <label><input type="checkbox" value="Kiçik Təndir Toyuq"> Kiçik Təndir Toyuq</label>
    <label><input type="checkbox" value="Kiçik Təndir Mal"> Kiçik Təndir Mal</label>
    <label><input type="checkbox" value="Böyük Təndir Toyuq"> Böyük Təndir Toyuq</label>
    <label><input type="checkbox" value="Böyük Təndir Mal"> Böyük Təndir Mal</label>
    <label><input type="checkbox" value="Lavaşda Dönər Toyuq"> Lavaşda Dönər Toyuq</label>
    <label><input type="checkbox" value="Lavaşda Dönər Mal"> Lavaşda Dönər Mal</label>

    <!-- Basdırma -->
    <label><input type="checkbox" value="Basdırma Toyuq"> Basdırma Toyuq</label>
    <label><input type="checkbox" value="Basdırma Mal"> Basdırma Mal</label>

    <!-- Adana -->
    <label><input type="checkbox" value="Adana Toyuq"> Adana Toyuq</label>
    <label><input type="checkbox" value="Adana Mal"> Adana Mal</label>

    <!-- Lavaşda -->
    <label><input type="checkbox" value="Lavaşda Toyuq"> Lavaşda Toyuq</label>
    <label><input type="checkbox" value="Lavaşda Mal"> Lavaşda Mal</label>

    <!-- Şaurma -->
    <label><input type="checkbox" value="Şaurma Çörəkdə Toyuq"> Şaurma Çörəkdə Toyuq</label>
    <label><input type="checkbox" value="Şaurma Çörəkdə Mal"> Şaurma Çörəkdə Mal</label>
    <label><input type="checkbox" value="Şaurma Lavaşda Toyuq"> Şaurma Lavaşda Toyuq</label>
    <label><input type="checkbox" value="Şaurma Lavaşda Mal"> Şaurma Lavaşda Mal</label>

    <!-- Köftə -->
    <label><input type="checkbox" value="Köftə Çörəkdə Toyuq"> Köftə Çörəkdə Toyuq</label>
    <label><input type="checkbox" value="Köftə Çörəkdə Mal"> Köftə Çörəkdə Mal</label>
    <label><input type="checkbox" value="Köftə Lavaşda Toyuq"> Köftə Lavaşda Toyuq</label>
    <label><input type="checkbox" value="Köftə Lavaşda Mal"> Köftə Lavaşda Mal</label>

    <!-- Burger və Hamburger -->
    <label><input type="checkbox" value="Burger Toyuq"> Burger Toyuq</label>
    <label><input type="checkbox" value="Burger Mal"> Burger Mal</label>
    <label><input type="checkbox" value="Hamburger"> Hamburger</label>

    <!-- Sandviç və Sosis -->
    <label><input type="checkbox" value="Sandviç Böyük"> Sandviç Böyük</label>
    <label><input type="checkbox" value="Sandviç Kiçik"> Sandviç Kiçik</label>
    <label><input type="checkbox" value="Sosis Böyük"> Sosis Böyük</label>
    <label><input type="checkbox" value="Sosis Kiçik"> Sosis Kiçik</label>

    <!-- Kartof -->
    <label><input type="checkbox" value="Kartof Fri"> Kartof Fri</label>

    <!-- Setlər -->
    <label><input type="checkbox" value="Set 1"> Set 1</label>
    <label><input type="checkbox" value="Set 2"> Set 2</label>
    <label><input type="checkbox" value="Set 3"> Set 3</label>
    <label><input type="checkbox" value="Set 4"> Set 4</label>
    <label><input type="checkbox" value="Set 5"> Set 5</label>
    <label><input type="checkbox" value="Set 6"> Set 6</label>

    <!-- Kampaniya -->
    <label><input type="checkbox" value="Dönər + Ayran 2m"> Kampaniya (Dönər + Ayran 2m)</label>
</div>

<h2>Qeyd:</h2>
<input id="note" type="text" placeholder="Məs: Acılı, sous az olsun...">

<button onclick="sendOrder()">📤 Sifarişi Göndər</button>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="firebase.js"></script>

<script>
const audio = new Audio("order.mp3");

function sendOrder() {
    const table = document.getElementById("table").value;
    if (!table) { alert("Masa nömrəsi daxil olunmalıdır!"); return; }

    const selectedMeals = [];
    document.querySelectorAll('#meal-options input[type=checkbox]:checked').forEach(cb => {
        selectedMeals.push(cb.value);
    });

    if (selectedMeals.length === 0) { alert("Ən azı 1 məhsul seçilməlidir!"); return; }

    const note = document.getElementById("note").value;
    const order = { meals: selectedMeals, table, note, time: new Date().toLocaleTimeString() };

    database.ref("orders").push(order)
        .then(() => {
            audio.play();
            alert("✔ Sifariş mətbəxə göndərildi!");
            document.getElementById("table").value = "";
            document.getElementById("note").value = "";
            document.querySelectorAll('#meal-options input[type=checkbox]').forEach(cb => cb.checked = false);
        })
        .catch(error => {
            alert("❌ Sifarişi göndərmək mümkün olmadı: " + error);
        });
}
</script>

</body>
</html>
